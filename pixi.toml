[workspace]
authors = ["Atreya Choudhury"]
channels = ["conda-forge"]
name = "phate"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/phate.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/phate.yml"
check = "python -c 'import phate, graphtools; print(phate.__version__, graphtools.__version__)'"

[dependencies]
python = ">=3.14.4,<3.15"
numpy = ">=2.4.3,<3"
scipy = ">=1.17.1,<2"
scikit-learn = ">=1.9.0,<2"
h5py = ">=3.16.0,<4"
polars = ">=1,<2"
matplotlib-base = ">=3.0"

# PyPI, not bioconda: bioconda's phate 2.0.0 recipe still requires scprep, which
# pins pandas <2.1 and so python <=3.11. The PyPI wheel dropped scprep (and
# s_gd2 -- SGD-MDS is in-package now), and needs graphtools >=2.1.0, which
# conda-forge doesn't have (stops at 1.5.3). graphtools is pinned too because it
# builds the kNN graph, and envs/phate.yml would otherwise leave it to pip.
[pypi-dependencies]
phate = "==2.0.0"
graphtools = "==2.1.0"

# env for quick dev tasks - avoid the regular deps
[feature.dev.dependencies]
python = ">=3.14.4,<3.15"
pyyaml = ">=6"
curl = "*"

[feature.dev.tasks]
sync = "sh -c 'curl -fsSL https://raw.githubusercontent.com/omni-scrna/boilerplate/${BRANCH:-main}/scripts/pull.py | python -'"

[feature.test.dependencies]
pytest = ">=8"

[feature.test.tasks]
test = "pytest"

[environments]
dev = { features = ["dev"], no-default-feature = true }
test = { features = ["test"] }
